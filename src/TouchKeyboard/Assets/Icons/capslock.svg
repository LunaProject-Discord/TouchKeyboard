<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!--
    Caps Lock キーの刻印。1000x1000 のビューボックスに置く座標が
    src/TouchKeyboard/Views/KeyButton.cs の BuildCapsLockGlyph の元データ。
    形を直すときはまずここを直し、KeyButton.cs 側の PathGeometry に座標を反映すること。

    矢印は Segoe Fluent Icons の UpArrowShiftKey（U+E752）の輪郭を、
    System.Drawing.Drawing2D.GraphicsPath.AddString で実際のグリフから抽出した値を
    元にする（手描きではなく実在のアイコンの改変であることを保証するため）。
    外側の輪郭・内側の穴（リボン形状の抜き）・下の横線の 3 つの部分から成り、
    fill-rule="evenodd" で外側と内側の差分を塗る。

    ただし GDI+（GraphicsPath.AddString）でこのフォント・このグリフを抽出すると、
    実際に Shift キーが WinUI（DirectWrite）で描く見た目より横に細い形になる
    （利用者の指摘：「下の Shift キーと比べたときに矢印の縦横比が異なるように
    見える」）。実機のデバッグ撮影機能（KeyboardWindow.xaml.cs の
    CaptureDebugScreenshotAsync）で Shift キーの実際の描画を撮って測ったところ、
    肩の最大幅は全体の高さの約 98%（ほぼ正方形）だったのに対し、GDI+ の抽出値
    そのまま（幅 829.1 / 高さ 999.5 ≒ 83%）はそれより明らかに細い。原因は
    GDI+ とこのアプリの実際の描画（DirectWrite）とでこのフォント・グリフの
    解釈が食い違うことにあるとみられ、GDI+ 側の抽出をやり直しても同じ値に
    なる（フォント自体は正しく見つかっている）ため、抽出後に補正するしかない。

    実測の目標比（横/縦 ≒ 0.98）に合わせ、x=500（矢印自身の左右対称の中心線）
    を軸に、全座標の x だけを広げてある（y はそのまま）。最初は 1.18 倍にしたが、
    「今度は若干横に広がりすぎている」との指摘で 1.10 倍に落とした。南京錠側の
    数値はこの矢印の変更と独立に決めた固定の最終キャンバス座標なので、
    ここを直しても再計算の必要はない。

    南京錠は矢印の右下の角に重ねるバッジとして置く。最初は弦（上の弧）の中心を
    矢印の右肩の角（外側の輪郭が斜めの縁から水平に折れる点、(815.92,625)）に
    合わせつつ、胴の底辺を矢印下端の横線の底（y=1000）に揃えていた（この 2 条件は
    南京錠の大きさを 1 つ決めれば両立するので、その大きさで解いていた）。

    その後「そもそも南京錠が小さい」という指摘で拡大した。2 条件を両方満たした
    まま拡大することはできない（大きさが 1 つに決まる連立式のため）ので、
    南京錠の外接矩形の右下角（拡大前の (987.9667…,1000.0000…)）を固定し、
    そこから左上へ広がる形で拡大した（利用者の指示：「底辺を揃えたまま大きく
    する」）。底辺は引き続き y=1000 に揃っている。最初は 1.5 倍にしたが、
    「やはり 1.4 にしてください」との指示で 1.4 倍に変更した（弦の中心は
    角 (815.92,625) からはずれて (747.10,475.00) 付近になる）。
  -->
  <path fill-rule="evenodd" fill="#000000"
        d="M328.13,875 C314.15,875 300.91,872.56 288.38,867.68 C275.84,862.79 264.83,856.04 255.35,847.41 C245.86,838.79 238.43,828.78 233.05,817.38 C227.68,805.99 225,793.95 225,781.25 L225,625 L152.49,625 C137.81,625 123.84,622.4 110.6,617.19 C97.34,611.98 85.79,604.9 75.95,595.95 C66.1,587 58.32,576.58 52.59,564.7 C46.85,552.82 43.99,540.2 43.99,526.86 C43.99,503.42 52.23,482.58 68.7,464.36 L473.15,11.72 C476.37,8.14 480.4,5.37 485.23,3.42 C490.07,1.46 494.98,0.49 500,0.49 C505.02,0.49 509.93,1.46 514.77,3.42 C519.6,5.37 523.63,8.14 526.85,11.72 L931.3,464.36 C947.77,482.58 956.01,503.42 956.01,526.86 C956.01,540.53 953.15,553.3 947.41,565.19 C941.68,577.07 933.9,587.4 924.05,596.19 C914.21,604.98 902.74,611.98 889.68,617.19 C876.61,622.4 862.55,625 847.51,625 L775,625 L775,781.25 C775,793.95 772.32,805.99 766.95,817.38 C761.57,828.78 754.14,838.79 744.65,847.41 C735.17,856.04 724.16,862.79 711.62,867.68 C699.09,872.56 685.85,875 671.88,875 Z
           M671.88,812.5 C681.18,812.5 689.24,809.41 696.04,803.22 C702.85,797.04 706.25,789.71 706.25,781.25 L706.25,593.75 C706.25,585.29 709.65,577.96 716.46,571.78 C723.26,565.59 731.32,562.5 740.63,562.5 L847.51,562.5 C858.25,562.5 867.57,558.92 875.44,551.76 C883.32,544.6 887.26,536.13 887.26,526.37 C887.26,522.14 886.45,518.15 884.84,514.4 C883.23,510.66 880.99,507.16 878.13,503.91 L500,80.57 L121.87,503.91 C119.01,507.16 116.77,510.66 115.16,514.4 C113.55,518.15 112.74,522.14 112.74,526.37 C112.74,536.13 116.68,544.6 124.56,551.76 C132.44,558.92 141.75,562.5 152.49,562.5 L259.38,562.5 C268.68,562.5 276.74,565.59 283.54,571.78 C290.35,577.96 293.75,585.29 293.75,593.75 L293.75,781.25 C293.75,789.71 297.15,797.04 303.96,803.22 C310.76,809.41 318.82,812.5 328.13,812.5 Z
           M259.38,1000 C250.07,1000 242.01,996.91 235.21,990.72 C228.4,984.54 225,977.21 225,968.75 C225,960.29 228.4,952.96 235.21,946.78 C242.01,940.59 250.07,937.5 259.38,937.5 L740.63,937.5 C749.93,937.5 757.99,940.59 764.79,946.78 C771.6,952.96 775,960.29 775,968.75 C775,977.21 771.6,984.54 764.79,990.72 C757.99,996.91 749.93,1000 740.63,1000 Z" />

  <!--
    南京錠と矢印は同じ黒で塗るため、線同士が接する場所では溶け合って境目が
    分からなくなる（利用者の指示：「お互いの線が重ならないようにしろ」）。

    試して捨てた案：
    - 南京錠と同じ輪郭（弦の穴・鍵穴も含む evenodd）を拡大しただけの縁取り
      → 弦は円弧で外接矩形の四隅まで届かず、角の部分で矢印がはみ出して見えた。
    - 角丸の矩形や楕円など、南京錠と違う形の縁取りで隙間なく覆う案
      → 切り口が南京錠の輪郭に沿わず、不自然だった（利用者の指示：
      「矢印の線の切り方を南京錠の楕円に沿うようにしろ」）。
    - 上と同じ縁取りのまま南京錠を左上へ寄せた案
      → 弦の穴・鍵穴の内側だけ矢印がわずかに透けて見えた（縁取り側の穴の
      拡大率と本体側の穴の拡大率がずれるため）。

    最終案：南京錠の外側の輪郭だけ（弦の穴・鍵穴は含まない、1 本目の
    サブパスのみ）を拡大したものを縁取りにする。穴を持たないので弦・鍵穴の
    どちら側でも矢印が透けず、かつ南京錠自身の輪郭に忠実に沿う。
    弦の中心を矢印の角に合わせた結果、1.25 倍では肩の外側にわずかに矢印の
    かけらが残った。倍率を上げれば消えるが白地が大きくなりすぎるため、
    縁取り自体は 1.2 倍まで小さく抑え、消えずに残るかけらの箇所（矢印の
    肩の少し上、弦の左側）だけを次の小さな四角で個別に消している。

    ただし 1.2 倍だと、南京錠本体を大きく囲むぶん右辺・下辺が南京錠本体の
    外接矩形より外側（キャンバスの空白域）まではみ出し、そこだけ余白として
    目立って見えた（利用者の指摘：「南京錠右側」）。上辺・左辺は矢印の斜めの
    縁や肩を覆うのに必要なので触らず、右辺・下辺だけ南京錠本体の外接矩形＋
    わずかな余白（6）まで clipPath で切り詰める。
    実行時は KeyButton.cs 側でキーの地色（_theme.BackgroundFor 等）を Fill に
    する。ここでは白で代用している。

    【clipPath の座標系についての注意】 <rect> で切り詰めたい範囲は、常に
    「この <path> 自身の transform を適用する前」のローカル座標（= d 属性と
    同じ座標系）で書く。transform 後の最終キャンバス座標（0-1000 のビュー
    ボックス）で書いてはいけない。要素に transform と clip-path を両方
    指定した場合、SVG は「まずローカル座標系で d も clip-path の参照先
    （userSpaceOnUse）も評価してから、その結果全体に transform を掛ける」
    という順で処理するため（実際に Browser で単独レンダリングして確認
    した。最終座標系の値をそのまま入れると、切り詰めたい辺と逆の辺
    （左・上）が切れて縁取りが消えたように見える不具合になる）。
    そのため、この <rect> の値は「最終的に欲しいキャンバス座標の矩形」を
    この <path> 自身の transform の逆変換でローカル座標へ戻したもの。

    南京錠を拡大したとき（1.5 倍→ 1.4 倍と変わった後も）、まず欲しい最終
    キャンバス座標の矩形を南京錠本体と同じ拡大率・同じ右下角固定の考え方で
    再計算し（右辺・下辺は南京錠本体の新しい外接矩形＋余白 6、上辺・左辺は
    縁取り自身の新しい外接矩形の少し内側）、その矩形をこの縁取りの
    transform の逆変換でローカル座標に戻して <rect> に書いている。

    矢印の縦横比を補正（x を 1.18 倍→ 1.10 倍に）した際、矢印の肩の位置が
    変わり、縁取りの倍率を 1.2 倍のままにすると肩の外側にわずかに矢印の
    かけらが再び見えるようになった（Browser で単独レンダリングして確認）。
    倍率を 1.25 倍に上げて解消した。この <rect> の値も 1.25 倍の縁取り用に
    再計算している。

    それでもなお、弦の右上のさらに外側に、矢印の斜めの縁のごく一部が
    縁取りに覆われず残っていた（利用者の指摘：「端の矢印の残骸」）。

    最初は南京錠本体は動かさず縁取りだけを x 方向へ +40 平行移動して
    しのごうとしたが、南京錠本体（黒い塗り）と縁取り（その下の白い塗り）の
    中心がずれ、「縁取りがずれている」と利用者に指摘された。縁取りは
    南京錠本体と同じ中心・同じ右下角基準で拡大するからこそ違和感なく
    重なって見えるのであって、位置だけを動かすと途端に不自然になる。

    平行移動はやめ、位置は南京錠本体と同じ中心のまま、倍率だけを
    1.25 倍から 1.3 倍にさらに上げて解消した（Browser で単独レンダリングし、
    矢印の縁が縁取りからはみ出さないことを確認済み）。白地が多少広がるが、
    位置が本体とずれて見えるより自然。
  -->
  <clipPath id="haloClip">
    <rect x="155.33333333333334" y="31.333333333333336" width="607.9897435897435" height="790.2205128205128" />
  </clipPath>
  <path fill="#ffffff" clip-path="url(#haloClip)"
        transform="matrix(0.9374999999999999,0,0,0.9374999999999999,278.35131868131907,235.79330067058135)"
        d="M500,42 C537.33,42 572,51.33 604,70 C636,88.67 661.33,114 680,146 C698.67,178 708,212.67 708,250 L708,334 C744,336.67 774,351 798,377 C822,403 834,433.33 834,468 L834,782 C834,819.33 820.67,851 794,877 C767.33,903 735.33,916 698,916 L302,916 C264.67,916 232.67,903 206,877 C179.33,851 166,819.33 166,782 L166,468 C166,433.33 178,403 202,377 C226,351 256,336.67 292,334 L292,250 C292,212.67 301.33,178 320,146 C338.67,114 364,88.67 396,70 C428,51.33 462.67,42 500,42 Z" />

  <!--
    縁取り（1.3 倍）でもまだ消えない矢印のかけら 1 か所だけを個別に消す図形。

    弦の右上の少し外側、縁取りの輪郭が矢印の斜めの縁のすぐ内側を通る位置に、
    幅 13・高さ 70 ほどの細い三日月形（上下が尖り、右辺だけが中ほどでわずかに
    膨らむ形）のかけらが残っていた（利用者の指摘：「残骸がまだ残っています。
    その部分だけ追加で重ねて消すように」）。縁取りの倍率をこれ以上上げても
    白地が目立つばかりで、位置を動かすと今度は南京錠本体とずれて見える
    （どちらも利用者に指摘済み）ため、この 1 か所だけを塗りつぶす。

    座標は Browser 上で実際に SVG を 2 倍解像度のキャンバスへ描画し、
    縁取りの外に残る黒（矢印）だけをピクセル単位で走査して測った実測値
    （x はおよそ 942.5〜955.5、y はおよそ 480〜549.5）。手描きの目分量ではない。
    三日月の輪郭に沿わせた多角形も試したが、右辺の膨らみが直線 2 本の
    近似では覆いきれない曲線だったため、単純に外接矩形＋余白で塗りつぶす
    形にした。この矩形の範囲には南京錠本体・矢印本体のどちらの絵柄も
    掛からないことを、同じピクセル走査で確認済み。
  -->
  <path fill="#ffffff" d="M938,476 L959,476 L959,554 L938,554 Z" />

  <!--
    南京錠は Fluent System Icons Filled の lock_closed（U+E79E）の輪郭をそのまま使う
    （同じく GraphicsPath.AddString で実在のグリフから抽出）。原寸（0,0 起点、
    668x874）を matrix で拡大・移動し、矢印の脚・肩に重ねてバッジのように置く。
    底辺は矢印下端の横線の底（y=1000）に揃える。
  -->
  <path fill-rule="evenodd" fill="#000000"
        transform="matrix(0.721153846153846,0,0,0.721153846153846,386.524395604396,339.423108362889)"
        d="M500,42 C537.33,42 572,51.33 604,70 C636,88.67 661.33,114 680,146 C698.67,178 708,212.67 708,250 L708,334 C744,336.67 774,351 798,377 C822,403 834,433.33 834,468 L834,782 C834,819.33 820.67,851 794,877 C767.33,903 735.33,916 698,916 L302,916 C264.67,916 232.67,903 206,877 C179.33,851 166,819.33 166,782 L166,468 C166,433.33 178,403 202,377 C226,351 256,336.67 292,334 L292,250 C292,212.67 301.33,178 320,146 C338.67,114 364,88.67 396,70 C428,51.33 462.67,42 500,42 Z
           M500,572 C480,572 465,581 455,599 C445,617 445,634.67 455,652 C465,669.33 480,678 500,678 C514.67,678 527,672.67 537,662 C547,651.33 552,639 552,625 C552,611 547,598.67 537,588 C527,577.33 514.67,572 500,572 Z
           M500,104 C460,104 425.67,118.33 397,147 C368.33,175.67 354,210 354,250 L354,334 L646,334 L646,250 C646,210 631.67,175.67 603,147 C574.33,118.33 540,104 500,104 Z" />
</svg>
